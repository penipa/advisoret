name: Overture coverage test

on:
  push:
    branches:
      - test/overture-coverage-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Overture client
        run: pip install --disable-pip-version-check overturemaps
      - name: Test Advisoret venues against Overture Places
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, math, os, re, subprocess, tempfile, unicodedata
          from difflib import SequenceMatcher

          SOURCE = 'tools/venue_coords_OK_fixed.csv'
          TARGETS = [
              'Restaurant El Rall',
              'Les Cholines',
              'Hotel Alahuar',
              'Bar La Roca',
              'Quitín',
              'Ca Rakel',
              'El Campús',
              'Casa Herminia',
              'Restaurante Toni Cantó',
              'Ca Saoret',
              'La Cantina de Ruzafa',
              'La Mesedora',
              'Les Tapes de Rafa',
          ]

          GENERIC = {'bar','restaurant','restaurante','cafeteria','cafetería','hotel','cafe','café'}

          def norm(s):
              s = unicodedata.normalize('NFKD', s or '').encode('ascii','ignore').decode().lower()
              toks = [x for x in re.findall(r'[a-z0-9]+', s) if x not in GENERIC]
              return ' '.join(toks)

          def similarity(a,b):
              a,b = norm(a),norm(b)
              if not a or not b: return 0.0
              if a == b: return 1.0
              if a in b or b in a: return 0.94
              return SequenceMatcher(None,a,b).ratio()

          def hav(lat1,lon1,lat2,lon2):
              r=6371000.0
              p1,p2=math.radians(lat1),math.radians(lat2)
              dp=math.radians(lat2-lat1); dl=math.radians(lon2-lon1)
              a=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*r*math.asin(math.sqrt(a))

          with open(SOURCE, newline='', encoding='utf-8-sig') as f:
              allrows=list(csv.DictReader(f))
          byname={r['name']:r for r in allrows}
          rows=[]
          missing_source=[]
          for n in TARGETS:
              if n in byname: rows.append(byname[n])
              else: missing_source.append(n)

          print(f'SOURCE_ROWS={len(allrows)} TARGET_ROWS={len(rows)} MISSING_SOURCE={missing_source}')
          results=[]
          for i,r in enumerate(rows,1):
              name=r['name']; city=r['city']; lat=float(r['lat']); lon=float(r['lon'])
              # About 1.3 km N/S and >=1.3 km E/W in eastern Spain.
              dlat=0.012
              dlon=0.016
              bbox=f'{lon-dlon},{lat-dlat},{lon+dlon},{lat+dlat}'
              outfile=os.path.join(tempfile.gettempdir(), f'ov_{i}.geojson')
              cmd=['overturemaps','download',f'--bbox={bbox}','-f','geojson','--type=place','-o',outfile]
              p=subprocess.run(cmd, text=True, capture_output=True, timeout=120)
              if p.returncode != 0:
                  print('DOWNLOAD_ERROR', name, p.stderr[-1200:])
                  results.append({'name':name,'city':city,'status':'ERROR','candidate':'','distance_m':'','similarity':'','overture_id':'','candidates':0})
                  continue
              try:
                  with open(outfile,encoding='utf-8') as fh: data=json.load(fh)
                  feats=data.get('features',[]) if isinstance(data,dict) else []
              except Exception as e:
                  print('PARSE_ERROR',name,repr(e))
                  results.append({'name':name,'city':city,'status':'ERROR','candidate':'','distance_m':'','similarity':'','overture_id':'','candidates':0})
                  continue
              ranked=[]
              for ft in feats:
                  props=ft.get('properties') or {}
                  names=props.get('names') or {}
                  cand=names.get('primary') if isinstance(names,dict) else None
                  geom=ft.get('geometry') or {}
                  coords=geom.get('coordinates') or []
                  if not cand or len(coords)<2: continue
                  try:
                      clon,clat=float(coords[0]),float(coords[1])
                  except Exception: continue
                  dist=hav(lat,lon,clat,clon)
                  sim=similarity(name,cand)
                  # Name dominates; distance acts as validation/tiebreaker.
                  score=sim - min(dist,3000)/15000
                  ranked.append((score,sim,dist,cand,props.get('id') or ft.get('id') or ''))
              ranked.sort(reverse=True)
              best=ranked[0] if ranked else None
              if best:
                  score,sim,dist,cand,oid=best
                  if (sim>=0.82 and dist<=500) or (sim>=0.68 and dist<=180): status='CLEAR'
                  elif sim>=0.62 and dist<=1200: status='PROBABLE'
                  else: status='NOT_FOUND'
                  results.append({'name':name,'city':city,'status':status,'candidate':cand,'distance_m':round(dist),'similarity':round(sim,3),'overture_id':oid,'candidates':len(ranked)})
              else:
                  results.append({'name':name,'city':city,'status':'NOT_FOUND','candidate':'','distance_m':'','similarity':'','overture_id':'','candidates':0})

          print('\nRESULTS_CSV')
          fields=['name','city','status','candidate','distance_m','similarity','overture_id','candidates']
          print(','.join(fields))
          for x in results:
              print(','.join('"'+str(x[k]).replace('"','""')+'"' for k in fields))
          clear=sum(x['status']=='CLEAR' for x in results)
          probable=sum(x['status']=='PROBABLE' for x in results)
          notfound=sum(x['status']=='NOT_FOUND' for x in results)
          errors=sum(x['status']=='ERROR' for x in results)
          tested=len(results)-errors
          print('\nSUMMARY')
          print(f'tested={tested} clear={clear} probable={probable} not_found={notfound} errors={errors}')
          if tested:
              print(f'coverage_clear_pct={100*clear/tested:.1f}')
              print(f'coverage_clear_plus_probable_pct={100*(clear+probable)/tested:.1f}')
          if errors:
              raise SystemExit(2)
          PY
