name: Overture coverage test v2

on:
  push:
    branches:
      - test/overture-coverage-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Overture client
        run: pip install --disable-pip-version-check overturemaps
      - name: Test Advisoret venues against Overture Places
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, math, os, re, subprocess, tempfile, unicodedata
          from difflib import SequenceMatcher

          SOURCE = 'tools/venue_enrichment_premiados_coords_ALL.csv'
          TARGETS = [
              'Restaurant El Rall','Les Cholines','Hotel Alahuar','Bar La Roca','Quitín','Ca Rakel','El Campús',
              'Casa Herminia','Restaurante Toni Cantó','Ca Saoret','La Cantina de Ruzafa','La Mesedora','Les Tapes de Rafa',
              'Bar Uvi Segorbe','Pizcueta 14','Fonda Canyella','La Nova Terrassa','La Entrada','Nou Bar','Tabick'
          ]
          GENERIC={'bar','restaurant','restaurante','cafeteria','cafetería','hotel','cafe','café'}
          def norm(s):
              s=unicodedata.normalize('NFKD',s or '').encode('ascii','ignore').decode().lower()
              return ' '.join(x for x in re.findall(r'[a-z0-9]+',s) if x not in GENERIC)
          def sim(a,b):
              a,b=norm(a),norm(b)
              if not a or not b:return 0.0
              if a==b:return 1.0
              if a in b or b in a:return 0.94
              return SequenceMatcher(None,a,b).ratio()
          def hav(a,b,c,d):
              r=6371000;p1,p2=math.radians(a),math.radians(c);dp=math.radians(c-a);dl=math.radians(d-b)
              x=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*r*math.asin(math.sqrt(x))

          with open(SOURCE,newline='',encoding='utf-8-sig') as f: allrows=list(csv.DictReader(f))
          byname={r['name']:r for r in allrows}
          rows=[byname[n] for n in TARGETS if n in byname]
          print(f'SOURCE_ROWS={len(allrows)} TARGET_ROWS={len(rows)} MISSING={[n for n in TARGETS if n not in byname]}')
          results=[]
          for i,r in enumerate(rows,1):
              name,city,lat,lon=r['name'],r['city'],float(r['lat']),float(r['lon'])
              bbox=f'{lon-0.016},{lat-0.012},{lon+0.016},{lat+0.012}'
              out=os.path.join(tempfile.gettempdir(),f'ov_{i}.geojson')
              p=subprocess.run(['overturemaps','download',f'--bbox={bbox}','-f','geojson','--type=place','-o',out],text=True,capture_output=True,timeout=120)
              if p.returncode:
                  print('DOWNLOAD_ERROR',name,p.stderr[-800:]);results.append((name,city,'ERROR','','','','',0));continue
              try:
                  data=json.load(open(out,encoding='utf-8'))
              except Exception as e:
                  print('PARSE_ERROR',name,e);results.append((name,city,'ERROR','','','','',0));continue
              ranked=[]
              for ft in data.get('features',[]):
                  pr=ft.get('properties') or {}; names=pr.get('names') or {}; cand=names.get('primary') if isinstance(names,dict) else None
                  co=(ft.get('geometry') or {}).get('coordinates') or []
                  if not cand or len(co)<2:continue
                  try:clon,clat=float(co[0]),float(co[1])
                  except:continue
                  dist=hav(lat,lon,clat,clon); ss=sim(name,cand); score=ss-min(dist,3000)/15000
                  ranked.append((score,ss,dist,cand,pr.get('id') or ft.get('id') or ''))
              ranked.sort(reverse=True)
              if not ranked:results.append((name,city,'NOT_FOUND','','','','',0));continue
              _,ss,dist,cand,oid=ranked[0]
              status='CLEAR' if ((ss>=0.82 and dist<=500) or (ss>=0.68 and dist<=180)) else ('PROBABLE' if ss>=0.62 and dist<=1200 else 'NOT_FOUND')
              results.append((name,city,status,cand,round(dist),round(ss,3),oid,len(ranked)))
          print('RESULTS_CSV')
          print('name,city,status,candidate,distance_m,similarity,overture_id,candidates')
          for row in results: print(','.join('"'+str(v).replace('"','""')+'"' for v in row))
          good=[r for r in results if r[2]!='ERROR'];clear=sum(r[2]=='CLEAR' for r in good);prob=sum(r[2]=='PROBABLE' for r in good);nf=sum(r[2]=='NOT_FOUND' for r in good);err=sum(r[2]=='ERROR' for r in results)
          print('SUMMARY');print(f'tested={len(good)} clear={clear} probable={prob} not_found={nf} errors={err}')
          if good:
              print(f'coverage_clear_pct={100*clear/len(good):.1f}');print(f'coverage_clear_plus_probable_pct={100*(clear+prob)/len(good):.1f}')
          if err: raise SystemExit(2)
          PY
